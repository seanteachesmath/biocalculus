</h4>
<div class="para logical">
<div class="para">For a function <span class="process-math">\(f(x)\text{,}\)</span> the derivative is given by</div>
<div class="displaymath process-math">
\begin{equation*}
f'(x) = \lim\limits_{h\to0}\frac{f(x+h)-f(x)}{h}
\end{equation*}
</div>
<div class="para">for all <span class="process-math">\(x\)</span>-values at which the limit exists.</div>
